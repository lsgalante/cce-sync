[package]
name = "cce-sync"
version = "0.1.0"
edition = "2021"
description = "The cce vault's sync engine: wire protocol, three-way merge, the server core over a Store trait, and the laptop daemon"

[lib]
name = "cce_sync"
path = "src/lib.rs"

[[bin]]
name = "cce-sync"
path = "src/main.rs"
required-features = ["daemon"]

[features]
# On by default so `cargo build -p cce-sync` and ccebuild build the binary.
# The library's other users (cce-sync-server, cce-vault-web, both wasm32,
# where these don't build) depend on it with default-features = false.
default = ["daemon"]
# The MCP tools (`mcp`): the vault index, whose settings reader is the
# daily notes' too. The server builds this for wasm32.
mcp = ["dep:cce-vault", "dep:chrono"]
# The workbook tools (.xlsx, on IronCalc). The server builds this; for
# wasm32 it patches ironcalc to a copy whose zip has only deflate (the
# default bzip2/zstd codecs are C and don't build there).
xlsx = ["mcp", "dep:ironcalc", "dep:zip"]
# The laptop binary: the daemon, import, status, history, restore, login.
daemon = [
    "mcp",
    "dep:ureq",
    "dep:walkdir",
    "dep:notify",
    "dep:tungstenite",
    "dep:keyring",
    "dep:chrono",
    "dep:kdl",
    "dep:cce-vault",
    "dep:cce-core",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
similar = "3"
ureq = { version = "3", optional = true, features = ["json"] }
walkdir = { version = "2.5", optional = true }
notify = { version = "8.2", optional = true }
tungstenite = { version = "0.30", optional = true, features = ["rustls-tls-webpki-roots"] }
# The token, in the secret service under ("cce-sync", <server>), as
# cce-calendar keeps cce-mail's passwords.
keyring = { version = "3", optional = true, features = ["sync-secret-service"] }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }
kdl = { version = "4.6", optional = true }
# The vault's root (config.kdl `vault { path }`) and its atomic write.
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "5bec1038dc74780664463f072e759c002a8f1b24", optional = true }
# read_request_line, for the status socket.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "2c8855460e2cbe4d5e90d095daebc4ad30c94b80", optional = true, default-features = false }

# The workbook tools: the engine cce-spreadsheet uses (same version), and
# zip to see which parts of a workbook IronCalc would not keep.
ironcalc = { version = "0.8.3", optional = true }
zip = { version = "0.6", optional = true, default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
