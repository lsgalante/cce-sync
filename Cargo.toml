[package]
name = "cce-sync"
version = "0.1.0"
edition = "2021"
description = "The cce vault's sync engine: wire protocol, three-way merge, the server core over a Store trait, and the laptop daemon"

[lib]
name = "cce_sync"
path = "src/lib.rs"

[[bin]]
name = "cce-sync"
path = "src/main.rs"
required-features = ["daemon"]

[features]
# On by default so `cargo build -p cce-sync` and ccebuild build the binary.
# The library's other users (cce-sync-server, cce-vault-web, both wasm32,
# where these don't build) depend on it with default-features = false.
default = ["daemon"]
# The laptop binary (import, status; the daemon proper comes in phase 2).
daemon = ["dep:ureq", "dep:walkdir"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
similar = "3"
ureq = { version = "3", optional = true, features = ["json"] }
walkdir = { version = "2.5", optional = true }

[dev-dependencies]
tempfile = "3"
